# Autostart Applications for Sway

# Logo key. Use Mod1 for Alt.
set $mod Mod4
# Home row direction keys, like vim
set $left h
set $down j
set $up k
set $right l

### Key bindings

# Basics:

# Open a terminal
bindsym $mod+Return exec $term
# Close the focused window
bindsym $mod+q kill
# Run a command launcher
bindsym $mod+r exec $menu
# Open a web browser
bindsym $mod+b exec $browser
# Make the current window floating
floating_modifier $mod normal
# Reload the Sway configuration
bindsym $mod+Shift+c reload
# Exit Sway with confirmation
bindsym $mod+Shift+q exec swaynag -t warning -m 'You pressed the exit shortcut. Do you really want to exit sway? This will end your Wayland session.' -B 'Yes, exit sway' 'swaymsg exit'

# Moving around:

# Move focus in different directions
bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right

# Move the focused window in different directions
bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right

# Workspaces:

# Switch to specific workspaces
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

# Move containers between workspaces
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10

# Layout stuff:

# Split the current container horizontally or vertically
bindsym $mod+c splith
bindsym $mod+v splitv
# Switch between different layout styles
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split
# Toggle fullscreen for the current window
bindsym $mod+f fullscreen
# Toggle floating mode for the current window
bindsym $mod+Shift+space floating toggle
# Swap focus between tiling and floating areas
bindsym $mod+space focus mode_toggle

# Scratchpad:

# Show and move the scratchpad terminal
bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus scratchpad show
bindsym $mod+t [app_id="scratchpad-terminal"] scratchpad show
bindsym $mod+shift+t [app_id="scratchpad-terminal"] move scratchpad
bindsym $mod+m [app_id="psst-gui"] scratchpad show
bindsym $mod+shift+m [app_id="psst-gui"] move scratchpad

# Clipman
bindsym $mod+p exec clipman pick -t bemenu

# Screenshot
bindsym $mod+F11 exec grim -g "$(slurp)" - | swappy -f -

# Brightness controls
bindsym --locked XF86MonBrightnessUp exec xbacklight -inc 5
bindsym --locked XF86MonBrightnessDown exec  xbacklight -dec 5

# Keybindings for sound

# Raise the audio volume
bindsym $mod+XF86AudioRaiseVolume exec pactl set-sink-volume @DEFAULT_SINK@ +5%
# Lower the audio volume
bindsym $mod+XF86AudioLowerVolume exec pactl set-sink-volume @DEFAULT_SINK@ -5%
# Toggle mute/unmute
bindsym $mod+XF86AudioMute exec pactl set-sink-mute @DEFAULT_SINK@ toggle


# Different screen tests
bindsym $mod+Control+Shift+Right move workspace to output right
bindsym $mod+Control+Shift+Left move workspace to output left
bindsym $mod+Control+Shift+Down move workspace to output down
bindsym $mod+Control+Shift+Up move workspace to output up
